<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<link rel="manifest" href="manifest.webmanifest">
<title>SimEHR</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#17202a;--muted:#667085;--line:#d9dee7;--accent:#2563eb;--soft:#eef4ff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:700}.sub{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.nav{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px}.nav.active{background:var(--soft);color:var(--accent);font-weight:600}
.main{padding:18px;max-width:1100px;width:100%;margin:auto}.patient-head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.section-title{font-size:17px;font-weight:650;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;color:#344054}.field,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--text)}
textarea{resize:vertical}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px}
.compact-note{min-height:64px}.learning-note{min-height:150px}.order-block{border-top:1px solid var(--line);padding:12px 0}.flowsheet th,.flowsheet td{min-width:108px}.flowsheet .sticky-label{position:sticky;left:0;background:#fff;z-index:2;min-width:150px}.checkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.check input{margin-right:7px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}th{background:#f8fafc}
.scroll{overflow:auto}.toast{position:fixed;bottom:18px;right:18px;background:#17202a;color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:20}
.library-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.library-row:last-child{border-bottom:0}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:61px;z-index:4;border-right:0;border-bottom:1px solid var(--line);overflow:auto;flex-direction:row}.nav{white-space:nowrap}.main{padding:12px}.g2,.g3{grid-template-columns:1fr}.checkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px}}

/* SimEHR soft pale-pink theme */
:root{
  --pink-50:#fff8fb;
  --pink-100:#fdeef4;
  --pink-200:#f8dce8;
  --pink-300:#f2bfd3;
  --pink-500:#d98aaa;
  --pink-700:#9d526f;
  --ink:#3d3440;
  --muted:#786d76;
  --line:#eee2e8;
  --card:#ffffff;
  --shadow:0 8px 24px rgba(92,55,72,.07);
}
body{
  background:linear-gradient(180deg,var(--pink-50) 0%,#fff 42%);
  color:var(--ink);
}
header{
  background:rgba(255,255,255,.92)!important;
  border-bottom:1px solid var(--pink-200)!important;
  box-shadow:0 2px 14px rgba(92,55,72,.05);
  backdrop-filter:blur(10px);
}
header h1,.brand,.logo{color:var(--pink-700)!important}
.card{
  background:var(--card);
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  box-shadow:var(--shadow);
}
.section-title{
  color:var(--pink-700)!important;
  letter-spacing:.01em;
}
.btn{
  border:1px solid var(--pink-200)!important;
  background:#fff!important;
  color:var(--pink-700)!important;
  border-radius:10px!important;
  transition:.15s ease;
}
.btn:hover{background:var(--pink-50)!important;border-color:var(--pink-300)!important;transform:translateY(-1px)}
.btn.primary{
  background:var(--pink-500)!important;
  border-color:var(--pink-500)!important;
  color:#fff!important;
}
.btn.primary:hover{background:var(--pink-700)!important;border-color:var(--pink-700)!important}
.btn.danger{color:#a05b6d!important}
.field{
  border:1px solid #e7dce2!important;
  background:#fff!important;
  color:var(--ink)!important;
  border-radius:9px!important;
}
.field:focus{
  outline:none!important;
  border-color:var(--pink-300)!important;
  box-shadow:0 0 0 3px rgba(242,191,211,.24)!important;
}
.check{
  background:#fff8fb!important;
  border:1px solid var(--pink-200)!important;
  border-radius:10px!important;
}
.check:has(input:checked){
  background:var(--pink-100)!important;
  border-color:var(--pink-300)!important;
}
input[type="checkbox"]{accent-color:var(--pink-500)}
.badge{
  background:var(--pink-100)!important;
  color:var(--pink-700)!important;
  border:1px solid var(--pink-200);
}
.tabs,.nav,.tabbar{
  background:#fff!important;
  border-color:var(--line)!important;
}
.tabs button.active,.nav button.active,.tabbar button.active{
  color:var(--pink-700)!important;
  border-color:var(--pink-300)!important;
  background:var(--pink-100)!important;
}
table{border-color:var(--line)!important}
th{
  background:var(--pink-100)!important;
  color:var(--pink-700)!important;
}
.flowsheet .sticky-label{
  background:var(--pink-50)!important;
}
.flowsheet td{
  background:#fff!important;
}
.flowsheet td:focus-within{
  background:#fff8fb!important;
}
.order-block{
  border-color:var(--line)!important;
}
.muted{color:var(--muted)!important}
textarea.learning-note{
  background:linear-gradient(180deg,#fff 0%,#fffafd 100%)!important;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#e8c5d4;border-radius:20px}
::-webkit-scrollbar-track{background:#fff7fa}
@media(max-width:700px){
  .card{border-radius:14px!important;box-shadow:0 5px 16px rgba(92,55,72,.06)}
}
.brand-subtitle{font-size:12px;color:#9d7887;margin-top:-4px;letter-spacing:.04em}..media-preview{margin-top:10px;padding:10px;border:1px solid var(--pink-200);border-radius:12px;background:var(--pink-50);max-width:420px}.media-preview img{display:block;max-width:100%;max-height:320px;border-radius:8px;margin-bottom:6px}.patient-head{margin-bottom:14px}.nav{font-size:14px}.sidebar{gap:6px!important}
.readonly-mode .field{background:#faf7f9!important;color:#5d555b!important;border-color:#eadfe5!important}
.readonly-mode input,.readonly-mode textarea,.readonly-mode select{pointer-events:none;opacity:.9}
.readonly-mode .check{pointer-events:none;opacity:.88}
.readonly-banner{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:var(--pink-100);border:1px solid var(--pink-200);color:var(--pink-700);font-size:13px}
.ua-divider th,.ua-divider-cell{background:var(--pink-100)!important;color:var(--pink-700);font-weight:700}
.ua-label{padding-left:18px!important}
.tempcell{min-width:0}

.ro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.ro-field{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffafb}
.ro-field span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.ro-field strong{font-weight:600}
.ro-text{margin:14px 0;padding:12px 14px;border-left:3px solid var(--pink-300);background:#fffafb;border-radius:0 10px 10px 0;white-space:pre-wrap}
.ro-text h3{font-size:13px;color:var(--pink-700);margin:0 0 6px}
.ro-assess{padding:14px 0;border-bottom:1px solid var(--line)}
.ro-assess:last-child{border-bottom:0}
.ro-assess h3,.ro-subhead{margin:0 0 9px;color:var(--pink-700)}
.ro-chips{display:flex;flex-wrap:wrap;gap:7px}
.ro-chips span{padding:5px 9px;border-radius:999px;background:var(--pink-100);border:1px solid var(--pink-200);font-size:12px}
.ro-table td{padding:9px;text-align:center;background:#fff}
.ro-table th{padding:9px}
.ro-order-section{margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.ro-order{padding:12px 0;border-top:1px solid var(--line)}
.ro-order:first-of-type{border-top:0}
.ro-note{padding:14px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}
.ro-media{margin-top:10px;padding:10px;border:1px solid var(--pink-200);border-radius:12px;background:var(--pink-50);max-width:520px}
.ro-media img{display:block;max-width:100%;max-height:380px;border-radius:8px}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="simehr-charts-v1";
const assessmentGroups={
"Neuro":["Alert","Drowsy","Lethargic","Obtunded","Unresponsive","Oriented x4","Disoriented","Confused","Agitated","PERRLA","Slurred speech","Weakness","Numbness"],
"Respiratory":["Clear","Diminished","Crackles","Wheezes","Rhonchi","Tachypnea","Bradypnea","Dyspnea","Accessory muscle use","Cough","Nonproductive cough","Productive cough"],
"Cardiac":["Regular rhythm","Irregular rhythm","Tachycardia","Bradycardia","Normal S1/S2","Murmur","Peripheral pulses 2+","Weak pulses","Cap refill <2 sec","Cap refill >3 sec","Edema"],
"Skin":["Warm","Cool","Hot","Dry","Diaphoretic","Pale","Flushed","Cyanotic","Jaundiced","Intact","Edematous","Poor turgor"],
"GI":["Soft","Nontender","Tender","Distended","Nausea","Vomiting","Normal bowel sounds","Hypoactive bowel sounds","Hyperactive bowel sounds","Diarrhea","Constipation"],
"GU":["Continent","Incontinent","Clear urine","Cloudy urine","Dark urine","Hematuria","Dysuria","Decreased urine output"],
"Musculoskeletal":["Moves all extremities","Weakness","Limited ROM","Unsteady gait","Assist x1","Assist x2","Independent","Uses assistive device"],
"Pain":["No pain","Acute pain","Chronic pain","Sharp","Dull","Burning","Pressure","Cramping"]
};
let charts=load(), currentId=null, activeTab="summary";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(charts))}
function setPath(obj,path,value){const parts=path.split(".");let cur=obj;for(let i=0;i<parts.length-1;i++){if(!cur[parts[i]]||typeof cur[parts[i]]!=="object")cur[parts[i]]={};cur=cur[parts[i]]}cur[parts[parts.length-1]]=value}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function newChart(){const c={id:uid(),created:new Date().toISOString(),updated:new Date().toISOString(),patient:{name:"",dob:"",dobage:"",mrn:"",allergies:"",code:"Full Code",chief:"",scenario:""},assessment:{},vitals:[],labs:[],orders:{medications:[],interventions:[],imaging:[],consults:[],labwork:[],otherLabOrders:""},notes:[],final:{diagnosis:"",secondary:"",disposition:"",discharge:"",wentWell:"",improve:"",definitions:"",questions:"",finalized:false}};charts.unshift(c);save();currentId=c.id;activeTab="summary";render()}
function current(){return charts.find(c=>c.id===currentId)}
function update(){const c=current();if(!c)return;c.updated=new Date().toISOString();save()}
function nav(label){activeTab=label;render()}
function input(label,key,value,extra=""){return `<label>${label}<input class="field" data-key="${key}" value="${esc(value)}" ${extra}></label>`}
function render(){document.getElementById("app").innerHTML=current()?chartHTML():libraryHTML();bind()}
function libraryHTML(){return `<div class="app"><div class="top"><div><div class="brand">SimEHR</div><div class="sub">Nursing simulation charting • local storage</div></div><button class="btn primary" id="new">+ New Simulation</button></div><div class="main"><div class="card"><h2 class="section-title">Patient Library</h2><input id="search" class="field" placeholder="Search patient, scenario, diagnosis..."><div id="list">${libraryRows(charts)}</div></div><div class="card"><div class="section-title">Data & Backup</div><div class="actions"><button class="btn" id="export">Export chart library</button><label class="btn">Import chart library<input id="import" type="file" accept=".json" style="display:none"></label></div><p class="muted">Charts are stored on this device. Export regularly so you have a backup.</p></div></div></div>`}
function libraryRows(arr){if(!arr.length)return `<div class="empty">No simulations yet. Create your first chart.</div>`;return arr.map(c=>`<div class="library-row"><div><b>${esc(c.patient.name||"Unnamed patient")}</b><div class="muted">${esc(c.patient.scenario||"No scenario")} • ${new Date(c.updated).toLocaleDateString()}</div></div><div class="actions"><button class="btn open" data-id="${c.id}">Open</button><button class="btn danger del" data-id="${c.id}">Delete</button></div></div>`).join("")}
function chartHTML(){const c=current();return `<div class="app"><div class="top"><div><div class="brand">SimEHR</div><div class="sub">${esc(c.patient.name||"New Patient")} • ${esc(c.patient.scenario||"New Simulation")}</div></div><div class="actions"><button class="btn" id="back">← Patients</button><button class="btn" id="saveBtn" ${c.finalized?"style=\"display:none\"":""}>Save</button><button class="btn ${c.finalized?"primary":"primary"}" id="${c.finalized?"editChart":"finalizeChart"}">${c.finalized?"✎ Edit Chart":"✓ Finalize Chart"}</button></div></div><div class="layout"><aside class="sidebar">${["summary","assessment","vitals","labs","orders","notes","final"].map(x=>`<button class="nav ${activeTab===x?"active":""}" data-nav="${x}">${({summary:"👤 Patient Summary",assessment:"🩺 Assessment",vitals:"💗 Vitals / Flowsheet",labs:"🧪 Labs / Flowsheet",orders:"📋 Orders",notes:"📝 Nursing Notes",final:"🎀 Final Dx / Debrief"})[x]}</button>`).join("")}</aside><main class="main ${c.finalized?"readonly-mode":""}">${c.finalized?`<div class="readonly-banner">🔒 Finalized chart — read-only view. Click <b>Edit Chart</b> above if you need to make changes.</div>`:""}${patientHeader(c)}${tabHTML(c)}</main></div></div>`}
function patientHeader(c){return `<div class="patient-head"><div class="grid g3">${input("Patient name","patient.name",c.patient.name,'placeholder="e.g. John Doe"')}${input("DOB / AGE","patient.dobage",c.patient.dobage||c.patient.dob||"",'placeholder="e.g. 22 M"')}${input("MRN","patient.mrn",c.patient.mrn)}${input("Allergies","patient.allergies",c.patient.allergies)}<label>Code status<select class="field" data-key="patient.code"><option ${c.patient.code==="Full Code"?"selected":""}>Full Code</option><option ${c.patient.code==="DNR"?"selected":""}>DNR</option><option ${c.patient.code==="DNI"?"selected":""}>DNI</option></select></label>${input("Scenario","patient.scenario",c.patient.scenario)}</div></div>`}
function tabHTML(c){if(c.finalized)return readonlyTab(c);if(activeTab==="summary")return summary(c);if(activeTab==="assessment")return assessment(c);if(activeTab==="vitals")return flowsheet(c,"vitals",["Time","BP","HR","RR","SpO₂","Temp","Pain"],["time","bp","hr","rr","spo2","temp","pain"]);if(activeTab==="labs")return labs(c);if(activeTab==="orders")return orders(c);if(activeTab==="notes")return notes(c);return finalTab(c)}

function roField(label,value){return value?`<div class="ro-field"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`:""}
function roText(label,value){return value?`<div class="ro-text"><h3>${esc(label)}</h3><div>${esc(value)}</div></div>`:""}
function readonlyTab(c){
  if(activeTab==="summary")return `<div class="card"><h2 class="section-title">Patient Summary</h2><div class="ro-grid">${roField("Patient name",c.patient.name)}${roField("DOB / AGE",c.patient.dobage||c.patient.dob)}${roField("MRN",c.patient.mrn)}${roField("Allergies",c.patient.allergies)}${roField("Code status",c.patient.code)}${roField("Scenario",c.patient.scenario)}</div>${roText("Chief complaint",c.patient.chief)}${roText("History / relevant information",c.patient.history)}</div>`;
  if(activeTab==="assessment"){
    const groups=Object.entries(assessmentGroups).map(([g,opts])=>{const chosen=c.assessment[g]||[];const other=(c.assessment._other||{})[g]||"";return (chosen.length||other)?`<div class="ro-assess"><h3>${esc(g)}</h3>${chosen.length?`<div class="ro-chips">${chosen.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}${roText("Other / notes",other)}</div>`:""}).join("");
    return groups?`<div class="card"><h2 class="section-title">Assessment Findings</h2>${groups}</div>`:`<div class="card"><h2 class="section-title">Assessment Findings</h2><p class="muted">No assessment findings documented.</p></div>`;
  }
  if(activeTab==="vitals")return readonlyVitals(c);
  if(activeTab==="labs")return readonlyLabs(c);
  if(activeTab==="orders")return readonlyOrders(c);
  if(activeTab==="notes")return c.notes.length?`<div class="card"><h2 class="section-title">Nursing Notes</h2>${c.notes.slice().reverse().map(n=>`<div class="ro-note"><b>${esc(n.type)}</b><div class="muted">${new Date(n.time).toLocaleString()}</div><div>${esc(n.text)}</div></div>`).join("")}</div>`:`<div class="card"><h2 class="section-title">Nursing Notes</h2><p class="muted">No nursing notes documented.</p></div>`;
  return readonlyFinal(c);
}
function readonlyVitals(c){
  const rows=(c.vitals||[]).filter(r=>Object.entries(r).some(([k,v])=>k!=="time"&&v));
  if(!rows.length)return `<div class="card"><h2 class="section-title">Vitals Flowsheet</h2><p class="muted">No vitals documented.</p></div>`;
  const defs=[["bp","Blood pressure"],["hr","Heart rate"],["rr","Respiratory rate"],["spo2","SpO₂"],["temp","Temperature"],["pain","Pain"]];
  return `<div class="card"><h2 class="section-title">Vitals Flowsheet</h2><div class="scroll"><table class="flowsheet ro-table"><thead><tr><th class="sticky-label">Vital</th>${rows.map(r=>`<th>${esc(r.time||"")}</th>`).join("")}</tr></thead><tbody>${defs.map(([k,l])=>{const vals=rows.map(r=>r[k]||"");return vals.some(Boolean)?`<tr><th class="sticky-label">${l}</th>${vals.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`:""}).join("")}</tbody></table></div></div>`;
}
function readonlyLabs(c){
  const rows=(c.labs||[]).filter(r=>Object.keys(r).some(k=>k!=="time"&&r[k]&&(typeof r[k]!=="object"||Object.keys(r[k]).length)));
  if(!rows.length)return `<div class="card"><h2 class="section-title">Lab Results</h2><p class="muted">No lab results documented.</p></div>`;
  const cols=c.labCols||[];
  const blood=cols.filter(col=>rows.some(r=>r[col]));
  const ua=[["color","Color"],["clarity","Clarity"],["specificGravity","Specific gravity"],["pH","pH"],["protein","Protein"],["glucose","Glucose"],["ketones","Ketones"],["blood","Blood"],["bilirubin","Bilirubin"],["urobilinogen","Urobilinogen"],["nitrite","Nitrite"],["leukocyte","Leukocyte esterase"],["wbc","WBC"],["rbc","RBC"],["bacteria","Bacteria"],["casts","Casts"]].filter(([k])=>rows.some(r=>r.ua&&r.ua[k]));
  const table=(title,defs,get)=>defs.length?`<h3 class="ro-subhead">${title}</h3><div class="scroll"><table class="flowsheet ro-table"><thead><tr><th class="sticky-label">Lab</th>${rows.map(r=>`<th>${esc(r.time||"")}</th>`).join("")}</tr></thead><tbody>${defs.map(([k,l])=>`<tr><th class="sticky-label">${esc(l)}</th>${rows.map(r=>`<td>${esc(get(r,k)||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:"";
  return `<div class="card"><h2 class="section-title">Lab Results</h2>${table("Blood Work",blood.map(x=>[x,x]),(r,k)=>r[k])}${table("🧪 Urinalysis",ua,(r,k)=>r.ua?.[k])}</div>`;
}
function readonlyOrders(c){
  const sections=[["medications","Medications"],["interventions","Interventions"],["imaging","Imaging"],["consults","Consults"]];
  const content=sections.map(([key,title])=>{const arr=(c.orders[key]||[]);if(!arr.length)return "";return `<div class="ro-order-section"><h2 class="section-title">${title}</h2>${arr.map(o=>key==="imaging"?roImaging(o):roRegular(o,key)).join("")}</div>`}).join("");
  return content||`<div class="card"><h2 class="section-title">Orders</h2><p class="muted">No orders documented.</p></div>`;
}
function roImaging(o){return `<div class="ro-order">${roField("Study",`${o.type||""}${o.body?" — "+o.body:""}`)}${roField("Status",o.status)}${roText("Result / interpretation",o.result)}${o.mediaData?`<div class="ro-media"><img src="${o.mediaData}" alt="${esc(o.mediaName||"Diagnostic image")}"></div>`:""}</div>`}
function roRegular(o,key){return `<div class="ro-order">${roField(key==="interventions"?(o.kind==="ECG"?"ECG":"Intervention"):"Consult / specialty",key==="interventions"&&o.kind==="ECG"?(o.ecgType||"ECG"):o.description)}${roField("Status",o.status)}${key==="interventions"&&o.kind==="ECG"?roField("ECG interpretation",o.result):""}${key==="interventions"&&o.kind==="ECG"&&o.mediaData?`<div class="ro-media"><img src="${o.mediaData}" alt="ECG"></div>`:""}${key==="consults"?roText("Consulting physician's recommendations / response",o.response):""}</div>`}
function readonlyFinal(c){const f=c.final||{};const content=`${roField("Primary diagnosis",f.diagnosis)}${roField("Secondary diagnoses",f.secondary)}${roField("Disposition",f.disposition)}${roField("Discharge time",f.discharge)}${roText("Discharge instructions",f.instructions)}${roText("What went well",f.wentWell)}${roText("What could I have done better?",f.improve)}${roText("Definitions / concepts to review",f.definitions)}${roText("Questions to look up later",f.questions)}`;return `<div class="card"><h2 class="section-title">Final Diagnosis & Debrief</h2>${content||`<p class="muted">No final documentation entered.</p>`}</div>`}

function summary(c){return `<div class="card"><h2 class="section-title">Patient Summary</h2><label>Chief complaint<textarea class="field" rows="4" data-key="patient.chief">${esc(c.patient.chief)}</textarea></label><div style="height:12px"></div><label>History / relevant information<textarea class="field" rows="7" data-key="patient.history">${esc(c.patient.history||"")}</textarea></label></div><div class="card"><h2 class="section-title">Chart status</h2><span class="badge">${c.notes.length} notes</span> <span class="badge">${c.vitals.length} vital sets</span> <span class="badge">${c.labs.length} lab sets</span></div>`}
function assessment(c){return `<div class="card"><h2 class="section-title">Assessment</h2><p class="muted">Select every finding that applies. You can select multiple options in each section.</p>${Object.entries(assessmentGroups).map(([g,opts])=>`<div style="margin:18px 0"><h3>${g}</h3><div class="checkgrid">${opts.map(o=>`<label class="check"><input type="checkbox" data-assess="${esc(g)}" value="${esc(o)}" ${(c.assessment[g]||[]).includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div><label style="margin-top:8px">Other / notes<textarea class="field" rows="2" data-other="${esc(g)}">${esc((c.assessment._other||{})[g]||"")}</textarea></label></div>`).join("")}</div>`}
function flowsheet(c,type){
  const rows=c.vitals||[];
  while(rows.length<3)rows.push({time:"",bp:"",hr:"",rr:"",spo2:"",temp:"",pain:""});
  c.vitals=rows;
  const defs=[["bp","Blood pressure"],["hr","Heart rate"],["rr","Respiratory rate"],["spo2","SpO₂"],["temp","Temperature"],["pain","Pain"]];
  return `<div class="card"><div class="actions" style="justify-content:space-between"><div><h2 class="section-title">Vitals Flowsheet</h2><div class="muted">Measurements run vertically. Tab moves down the current time column. Enter temperature as °C or °F; it converts automatically.</div></div><button class="btn primary" id="addVitalTime">+ Time</button></div><div class="scroll"><table class="flowsheet"><thead><tr><th class="sticky-label">Vital</th>${rows.map((r,i)=>`<th><input class="field flow-time" data-row="${i}" value="${esc(r.time||"")}" placeholder="14:00"></th>`).join("")}</tr></thead><tbody>${defs.map(([key,label])=>`<tr><th class="sticky-label">${label}</th>${rows.map((r,i)=>`<td><input class="field flowcell ${key==="temp"?"tempcell":""}" data-row="${i}" data-k="${key}" value="${esc(r[key]||"")}" ${key==="temp"?'':''}></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}
function labs(c){
  const cols=c.labCols||["WBC","Hgb","Hct","Platelets","Na","K","Cl","CO₂","BUN","Cr","Glucose","Lactate"];
  c.labCols=cols;
  const selected=c.orders.labwork||[];
  const common=["CBC","BMP","CMP","Magnesium","Phosphorus","PT/INR","aPTT","Lactate","Troponin","BNP","Blood cultures","Urinalysis","Urine culture","ABG","VBG","Glucose","Lipase","Amylase","CRP","Procalcitonin","Pregnancy test","Type & screen"];
  const rows=c.labs||[];
  while(rows.length<3)rows.push({time:""});
  c.labs=rows;
  const ua=[["color","Color"],["clarity","Clarity"],["specificGravity","Specific gravity"],["pH","pH"],["protein","Protein"],["glucose","Glucose"],["ketones","Ketones"],["blood","Blood"],["bilirubin","Bilirubin"],["urobilinogen","Urobilinogen"],["nitrite","Nitrite"],["leukocyte","Leukocyte esterase"],["wbc","WBC"],["rbc","RBC"],["bacteria","Bacteria"],["casts","Casts"]];
  return `<div class="card"><h2 class="section-title">Lab Orders</h2><p class="muted">Select multiple labs at once. No individual add buttons or notes fields.</p><div class="checkgrid">${common.map(x=>`<label class="check"><input type="checkbox" class="labordercheck" value="${esc(x)}" ${selected.includes(x)?"checked":""}>${esc(x)}</label>`).join("")}</div><label style="margin-top:10px">Other lab orders<textarea class="field compact-note" id="otherLabOrders" rows="2" placeholder="Additional orders, one per line...">${esc(c.orders.otherLabOrders||"")}</textarea></label></div><div class="card"><div class="actions" style="justify-content:space-between"><div><h2 class="section-title">Lab Results Flowsheet</h2><div class="muted">Blood work and urinalysis have separate labeled sections. Tab moves down the current time column.</div></div><div class="actions"><button class="btn" id="addLab">+ Lab</button><button class="btn primary" id="addLabTime">+ Time</button></div></div><div class="scroll"><table class="flowsheet"><thead><tr><th class="sticky-label">Lab</th>${rows.map((r,i)=>`<th><input class="field lab-time" data-row="${i}" value="${esc(r.time||"")}" placeholder="14:00"></th>`).join("")}</tr></thead><tbody>${cols.map(col=>`<tr><th class="sticky-label"><input class="field labhead" data-col="${esc(col)}" value="${esc(col)}"></th>${rows.map((r,i)=>`<td><input class="field labcell" data-row="${i}" data-k="${esc(col)}" value="${esc(r[col]||"")}"></td>`).join("")}</tr>`).join("")}<tr class="ua-divider"><th class="sticky-label">🧪 URINALYSIS</th>${rows.map(()=>`<td class="ua-divider-cell"></td>`).join("")}</tr>${ua.map(([key,label])=>`<tr><th class="sticky-label ua-label">${label}</th>${rows.map((r,i)=>`<td><input class="field labcell" data-row="${i}" data-k="ua.${key}" value="${esc((r.ua||{})[key]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}
function orders(c){const groups=[["medications","Medications"],["interventions","Interventions"],["imaging","Imaging"],["consults","Consults"]];return groups.map(([key,title])=>`<div class="card"><div class="actions" style="justify-content:space-between"><h2 class="section-title">${title}</h2><button class="btn primary addOrder" data-type="${key}">+ Add</button></div>${(c.orders[key]||[]).map((o,i)=>key==="imaging"?imagingOrder(o,i):regularOrder(o,i,key)).join("")||`<p class="muted">No ${title.toLowerCase()} entered.</p>`}</div>`).join("")}
function imagingOrder(o,i){const types=["Ultrasound","CT","MRI","X-ray","Other"];const bodies={Ultrasound:["Abdomen","Pelvis","RUQ","Renal/Kidney","Bladder","OB/Pregnancy","DVT/Venous","Cardiac/Echo","Thyroid","Testicular/Scrotal","Breast","Other"],CT:["Head/Brain","Chest","Abdomen","Pelvis","Abdomen/Pelvis","Spine","Sinuses","Extremity","Other"],MRI:["Brain","Spine","Abdomen","Pelvis","Joint/Extremity","Cardiac","Other"],"X-ray":["Chest","Abdomen/KUB","Pelvis","Spine","Extremity","Skull","Other"],Other:["Other"]};const media=o.mediaData?`<div class="media-preview"><img src="${o.mediaData}" alt="${esc(o.mediaName||"Uploaded diagnostic image")}"><div class="muted">${esc(o.mediaName||"Uploaded image")}</div></div>`:(o.mediaName?`<div class="muted">Selected: ${esc(o.mediaName)}</div>`:"");return `<div class="order-block"><div class="grid g3"><label>Study type<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="type">${types.map(x=>`<option ${o.type===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Study / body<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="body">${(bodies[o.type||"Ultrasound"]||["Other"]).map(x=>`<option ${o.body===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Status<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="status"><option ${o.status==="Ordered"?"selected":""}>Ordered</option><option ${o.status==="In Progress"?"selected":""}>In Progress</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Pending"?"selected":""}>Pending</option></select></label></div><label style="margin-top:10px">Result / interpretation<textarea class="field compact-note ordercell" data-type="imaging" data-i="${i}" data-k="result" rows="3" placeholder="Enter result or interpretation...">${esc(o.result||"")}</textarea></label><label style="margin-top:10px">Upload image<input class="field media" data-type="imaging" data-i="${i}" type="file" accept="image/*"></label>${media}<button class="btn danger removeOrder" data-type="imaging" data-i="${i}" style="margin-top:8px">Remove</button></div>`}
function regularOrder(o,i,key){
  const isIntervention=key==="interventions";
  const isConsult=key==="consults";
  const isECG=isIntervention && o.kind==="ECG";
  const media=o.mediaData?`<div class="media-preview"><img src="${o.mediaData}" alt="${esc(o.mediaName||"ECG image")}"><div class="muted">${esc(o.mediaName||"Uploaded image")}</div></div>`:"";
  return `<div class="order-block">
    <div class="grid g2">
      <label>${isIntervention?"Intervention":"Consult / specialty"}
        ${isIntervention?`<select class="field ordercell" data-type="${key}" data-i="${i}" data-k="kind"><option ${o.kind==="Intervention"||!o.kind?"selected":""}>Intervention</option><option ${o.kind==="ECG"?"selected":""}>ECG</option></select>`:`<input class="field ordercell" data-type="${key}" data-i="${i}" data-k="description" value="${esc(o.description||"")}" placeholder="e.g. Cardiology">`}
      </label>
      <label>Status<select class="field ordercell" data-type="${key}" data-i="${i}" data-k="status">
        <option ${o.status==="Ordered"?"selected":""}>Ordered</option><option ${o.status==="In Progress"?"selected":""}>In Progress</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Pending"?"selected":""}>Pending</option>
      </select></label>
    </div>
    ${isIntervention&&!isECG?`<label style="margin-top:10px">Description<input class="field ordercell" data-type="${key}" data-i="${i}" data-k="description" value="${esc(o.description||"")}" placeholder="Enter intervention"></label>`:""}
    ${isECG?`<div class="grid g2" style="margin-top:10px"><label>ECG type<select class="field ordercell" data-type="${key}" data-i="${i}" data-k="ecgType"><option ${o.ecgType==="12-lead ECG"?"selected":""}>12-lead ECG</option><option ${o.ecgType==="Rhythm strip"?"selected":""}>Rhythm strip</option><option ${o.ecgType==="Other"?"selected":""}>Other</option></select></label><label>ECG interpretation<input class="field ordercell" data-type="${key}" data-i="${i}" data-k="result" value="${esc(o.result||"")}" placeholder="e.g. Sinus tachycardia"></label></div><label style="margin-top:10px">Upload ECG image<input class="field media" data-type="${key}" data-i="${i}" type="file" accept="image/*"></label>${media}`:""}
    ${isConsult?`<label style="margin-top:10px">Consulting physician's recommendations / response<textarea class="field compact-note ordercell" data-type="${key}" data-i="${i}" data-k="response" rows="3" placeholder="What did the consultant say or recommend?">${esc(o.response||"")}</textarea></label>`:""}
    <button class="btn danger removeOrder" data-type="${key}" data-i="${i}" style="margin-top:8px">Remove</button>
  </div>`;
}

function notes(c){return `<div class="card"><h2 class="section-title">Nursing Notes</h2><label>Note type<select class="field" id="noteType"><option>Focused assessment</option><option>Reassessment</option><option>Intervention</option><option>Provider notification</option><option>SBAR handoff</option></select></label><label style="margin-top:10px">Note<textarea class="field" id="noteText" rows="8" placeholder="Document objectively..."></textarea></label><button class="btn primary" id="addNote" style="margin-top:10px">Sign & timestamp</button></div><div class="card"><h2 class="section-title">Timeline</h2>${c.notes.slice().reverse().map(n=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(n.type)}</b><div class="muted">${new Date(n.time).toLocaleString()}</div><div style="white-space:pre-wrap;margin-top:5px">${esc(n.text)}</div></div>`).join("")||`<p class="muted">No notes yet.</p>`}</div>`}
function finalTab(c){return `<div class="card"><h2 class="section-title">Final Diagnosis & Disposition</h2><div class="grid g2">${input("Primary diagnosis","final.diagnosis",c.final.diagnosis)}${input("Secondary diagnoses","final.secondary",c.final.secondary)}<label>Disposition<select class="field" data-key="final.disposition"><option value="">Select...</option>${["Discharged home","Admitted","ICU","Transferred","OR","Other"].map(x=>`<option ${c.final.disposition===x?"selected":""}>${x}</option>`).join("")}</select></label>${input("Discharge time","final.discharge",c.final.discharge,'type="datetime-local"')}</div><label style="margin-top:12px">Discharge instructions<textarea class="field compact-note" rows="3" data-key="final.instructions">${esc(c.final.instructions||"")}</textarea></label></div><div class="card"><h2 class="section-title">My Learning Notes</h2><p class="muted">Large areas for reflection and study notes.</p><label>What went well<textarea class="field learning-note" rows="7" data-key="final.wentWell">${esc(c.final.wentWell||"")}</textarea></label><label style="margin-top:12px">What could I have done better?<textarea class="field learning-note" rows="7" data-key="final.improve">${esc(c.final.improve||"")}</textarea></label><label style="margin-top:12px">Definitions / concepts to review<textarea class="field learning-note" rows="7" data-key="final.definitions">${esc(c.final.definitions||"")}</textarea></label><label style="margin-top:12px">Questions to look up later<textarea class="field learning-note" rows="7" data-key="final.questions">${esc(c.final.questions||"")}</textarea></label></div>`}

function bind(){
  const c=current();
  document.getElementById("new")?.addEventListener("click",()=>newChart());
  document.querySelectorAll(".open").forEach(b=>b.onclick=()=>{currentId=b.dataset.id;activeTab="summary";render()});
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(confirm("Delete this simulation?")){charts=charts.filter(x=>x.id!==b.dataset.id);save();render()}});
  document.getElementById("search")?.addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.getElementById("list").innerHTML=libraryRows(charts.filter(x=>JSON.stringify(x).toLowerCase().includes(q)));bind()});
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));
  document.getElementById("back")?.addEventListener("click",()=>{currentId=null;render()});
  document.getElementById("saveBtn")?.addEventListener("click",()=>{update();toast("Chart saved")});
  document.querySelectorAll(".tempcell").forEach(el=>el.addEventListener("blur",e=>{
    const raw=e.target.value.trim();
    if(!raw)return;
    const m=raw.match(/^(-?\d+(?:\.\d+)?)\s*([CF])$/i);
    if(!m){toast("Temperature: enter a value like 38 C or 100.4 F");return}
    const v=Number(m[1]),u=m[2].toUpperCase();
    if(!Number.isFinite(v))return;
    const celsius=u==="C"?v:(v-32)*5/9;
    const fahrenheit=u==="F"?v:(v*9/5)+32;
    const roundedC=Math.round(celsius*10)/10, roundedF=Math.round(fahrenheit*10)/10;
    e.target.value=`${v} ${u} (${u==="C"?roundedF:roundedC} ${u==="C"?"F":"C"})`;
    c.vitals[+e.target.dataset.row].temp=e.target.value;update();
  }));
  document.getElementById("finalizeChart")?.addEventListener("click",()=>{
    if(confirm("Finalize this chart? It will become read-only until you choose Edit Chart.")){c.finalized=true;update();render();toast("Chart finalized")}
  });
  document.getElementById("editChart")?.addEventListener("click",()=>{c.finalized=false;update();render();toast("Chart is editable again")});

  document.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",e=>{setPath(c,e.target.dataset.key,e.target.value);update()}));
  document.querySelectorAll("[data-assess]").forEach(el=>el.addEventListener("change",e=>{const g=e.target.dataset.assess;c.assessment[g]=c.assessment[g]||[];if(e.target.checked)c.assessment[g].push(e.target.value);else c.assessment[g]=c.assessment[g].filter(x=>x!==e.target.value);update()}));
  document.querySelectorAll("[data-other]").forEach(el=>el.addEventListener("input",e=>{c.assessment._other=c.assessment._other||{};c.assessment._other[e.target.dataset.other]=e.target.value;update()}));

  document.querySelectorAll(".flow-time").forEach(el=>el.addEventListener("input",e=>{c.vitals[+e.target.dataset.row].time=e.target.value;update()}));
  document.querySelectorAll(".flowcell").forEach(el=>el.addEventListener("input",e=>{c.vitals[+e.target.dataset.row][e.target.dataset.k]=e.target.value;update()}));
  function flowTab(e){
    if(e.key!=="Tab") return;
    const target=e.target;
    if(!target.classList.contains("flowcell") && !target.classList.contains("labcell")) return;
    e.preventDefault();

    const cls=target.classList.contains("flowcell")?".flowcell":".labcell";
    const all=[...document.querySelectorAll(cls)];
    const timeIndex=Number(target.dataset.row);
    const currentKey=target.dataset.k;
    const timeRows=[...new Set(all.map(x=>Number(x.dataset.row)))].sort((a,b)=>a-b);
    const keys=[...new Set(all.map(x=>x.dataset.k))];
    const keyIndex=keys.indexOf(currentKey);

    let next=null;
    if(!e.shiftKey){
      // Down the current time column.
      if(keys[keyIndex+1]!==undefined){
        next=all.find(x=>Number(x.dataset.row)===timeIndex && x.dataset.k===keys[keyIndex+1]);
      } else {
        // At the bottom: wrap to the first row of the next time column.
        const nextTime=timeRows[timeRows.indexOf(timeIndex)+1];
        if(nextTime!==undefined) next=all.find(x=>Number(x.dataset.row)===nextTime && x.dataset.k===keys[0]);
      }
    } else {
      // Up the current time column.
      if(keys[keyIndex-1]!==undefined){
        next=all.find(x=>Number(x.dataset.row)===timeIndex && x.dataset.k===keys[keyIndex-1]);
      } else {
        // At the top: wrap to the last row of the previous time column.
        const prevTime=timeRows[timeRows.indexOf(timeIndex)-1];
        if(prevTime!==undefined) next=all.find(x=>Number(x.dataset.row)===prevTime && x.dataset.k===keys[keys.length-1]);
      }
    }
    if(next){next.focus();next.select?.();}
  }
  document.addEventListener("keydown",flowTab);

  document.getElementById("addVitalTime")?.addEventListener("click",()=>{c.vitals.push({time:"",bp:"",hr:"",rr:"",spo2:"",temp:"",pain:""});update();render()});

  document.querySelectorAll(".lab-time").forEach(el=>el.addEventListener("input",e=>{c.labs[+e.target.dataset.row].time=e.target.value;update()}));
  document.querySelectorAll(".labcell").forEach(el=>el.addEventListener("input",e=>{const r=c.labs[+e.target.dataset.row],k=e.target.dataset.k;if(k.startsWith("ua.")){r.ua=r.ua||{};r.ua[k.slice(3)]=e.target.value}else r[k]=e.target.value;update()}));
  document.querySelectorAll(".labhead").forEach(el=>el.addEventListener("change",e=>{const old=e.target.dataset.col,next=e.target.value.trim()||old;if(next!==old){c.labCols=c.labCols.map(x=>x===old?next:x);c.labs.forEach(r=>{if(r[old]!==undefined){r[next]=r[old];delete r[old]}});update();render()}}));
  document.getElementById("addLabTime")?.addEventListener("click",()=>{c.labs.push({time:""});update();render()});
  document.getElementById("addLab")?.addEventListener("click",()=>{const name="New Lab "+(c.labCols.length+1);c.labCols.push(name);c.labs.forEach(r=>r[name]="");update();render()});
  document.querySelectorAll(".labordercheck").forEach(el=>el.addEventListener("change",()=>{c.orders.labwork=[...document.querySelectorAll(".labordercheck:checked")].map(x=>x.value);update()}));
  document.getElementById("otherLabOrders")?.addEventListener("input",e=>{c.orders.otherLabOrders=e.target.value;update()});

  document.querySelectorAll(".addOrder").forEach(b=>b.onclick=()=>{c.orders[b.dataset.type].push(b.dataset.type==="imaging"?{type:"Ultrasound",body:"Abdomen",status:"Ordered",result:""}:{description:"",status:"Ordered",response:"",kind:b.dataset.type==="interventions"?"Intervention":undefined});update();render()});
  document.querySelectorAll(".removeOrder").forEach(b=>b.onclick=()=>{c.orders[b.dataset.type].splice(+b.dataset.i,1);update();render()});
  document.querySelectorAll(".ordercell").forEach(el=>el.addEventListener("change",e=>{const o=c.orders[e.target.dataset.type][+e.target.dataset.i];o[e.target.dataset.k]=e.target.value;update();if(e.target.dataset.type==="imaging"&&e.target.dataset.k==="type"){o.body=e.target.value==="Ultrasound"?"Abdomen":e.target.value==="CT"?"Head/Brain":e.target.value==="MRI"?"Brain":e.target.value==="X-ray"?"Chest":"Other";render()}else if(e.target.dataset.type==="interventions"&&e.target.dataset.k==="kind"){render()}}));
  document.querySelectorAll(".media").forEach(el=>el.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const o=c.orders[e.target.dataset.type][+e.target.dataset.i];const reader=new FileReader();reader.onload=()=>{o.mediaName=f.name;o.mediaData=reader.result;update();render();toast("Image embedded in the chart")};reader.readAsDataURL(f)}));

  document.getElementById("addNote")?.addEventListener("click",()=>{const t=document.getElementById("noteText"),type=document.getElementById("noteType");if(!t.value.trim()){toast("Enter a note first");return}c.notes.push({time:new Date().toISOString(),type:type.value,text:t.value});t.value="";update();render();toast("Note signed")});
}
document.addEventListener("DOMContentLoaded",()=>{if(!currentId)render();});
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=4').catch(()=>{});}</script></body>
