<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<link rel="manifest" href="manifest.webmanifest">
<title>SimEHR</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#17202a;--muted:#667085;--line:#d9dee7;--accent:#2563eb;--soft:#eef4ff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:700}.sub{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.nav{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px}.nav.active{background:var(--soft);color:var(--accent);font-weight:600}
.main{padding:18px;max-width:1100px;width:100%;margin:auto}.patient-head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.section-title{font-size:17px;font-weight:650;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;color:#344054}.field,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--text)}
textarea{resize:vertical}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px}
.compact-note{min-height:64px}.learning-note{min-height:150px}.order-block{border-top:1px solid var(--line);padding:12px 0}.flowsheet th,.flowsheet td{min-width:108px}.flowsheet .sticky-label{position:sticky;left:0;background:#fff;z-index:2;min-width:150px}.checkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.check input{margin-right:7px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}th{background:#f8fafc}
.scroll{overflow:auto}.toast{position:fixed;bottom:18px;right:18px;background:#17202a;color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:20}
.library-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.library-row:last-child{border-bottom:0}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:61px;z-index:4;border-right:0;border-bottom:1px solid var(--line);overflow:auto;flex-direction:row}.nav{white-space:nowrap}.main{padding:12px}.g2,.g3{grid-template-columns:1fr}.checkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="simehr-charts-v1";
const assessmentGroups={
"Neuro":["Alert","Drowsy","Lethargic","Obtunded","Unresponsive","Oriented x4","Disoriented","Confused","Agitated","PERRLA","Slurred speech","Weakness","Numbness"],
"Respiratory":["Clear","Diminished","Crackles","Wheezes","Rhonchi","Tachypnea","Bradypnea","Dyspnea","Accessory muscle use","Cough","Nonproductive cough","Productive cough"],
"Cardiac":["Regular rhythm","Irregular rhythm","Tachycardia","Bradycardia","Normal S1/S2","Murmur","Peripheral pulses 2+","Weak pulses","Cap refill <2 sec","Cap refill >3 sec","Edema"],
"Skin":["Warm","Cool","Hot","Dry","Diaphoretic","Pale","Flushed","Cyanotic","Jaundiced","Intact","Edematous","Poor turgor"],
"GI":["Soft","Nontender","Tender","Distended","Nausea","Vomiting","Normal bowel sounds","Hypoactive bowel sounds","Hyperactive bowel sounds","Diarrhea","Constipation"],
"GU":["Continent","Incontinent","Clear urine","Cloudy urine","Dark urine","Hematuria","Dysuria","Decreased urine output"],
"Musculoskeletal":["Moves all extremities","Weakness","Limited ROM","Unsteady gait","Assist x1","Assist x2","Independent","Uses assistive device"],
"Pain":["No pain","Acute pain","Chronic pain","Sharp","Dull","Burning","Pressure","Cramping"]
};
let charts=load(), currentId=null, activeTab="summary";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(charts))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function newChart(){const c={id:uid(),created:new Date().toISOString(),updated:new Date().toISOString(),patient:{name:"",dob:"",mrn:"",allergies:"",code:"Full Code",chief:"",scenario:""},assessment:{},vitals:[],labs:[],orders:{medications:[],interventions:[],imaging:[],consults:[],labwork:[],otherLabOrders:""},notes:[],final:{diagnosis:"",secondary:"",disposition:"",discharge:"",wentWell:"",improve:"",definitions:"",questions:""}};charts.unshift(c);save();currentId=c.id;activeTab="summary";render()}
function current(){return charts.find(c=>c.id===currentId)}
function update(){const c=current();c.updated=new Date().toISOString();save()}
function nav(label){activeTab=label;render()}
function input(label,key,value,extra=""){return `<label>${label}<input class="field" data-key="${key}" value="${esc(value)}" ${extra}></label>`}
function render(){document.getElementById("app").innerHTML=current()?chartHTML():libraryHTML();bind()}
function libraryHTML(){return `<div class="app"><div class="top"><div><div class="brand">SimEHR</div><div class="sub">Nursing simulation charting • local storage</div></div><button class="btn primary" id="new">+ New Simulation</button></div><div class="main"><div class="card"><h2 class="section-title">Patient Library</h2><input id="search" class="field" placeholder="Search patient, scenario, diagnosis..."><div id="list">${libraryRows(charts)}</div></div><div class="card"><div class="section-title">Data & Backup</div><div class="actions"><button class="btn" id="export">Export chart library</button><label class="btn">Import chart library<input id="import" type="file" accept=".json" style="display:none"></label></div><p class="muted">Charts are stored on this device. Export regularly so you have a backup.</p></div></div></div>`}
function libraryRows(arr){if(!arr.length)return `<div class="empty">No simulations yet. Create your first chart.</div>`;return arr.map(c=>`<div class="library-row"><div><b>${esc(c.patient.name||"Unnamed patient")}</b><div class="muted">${esc(c.patient.scenario||"No scenario")} • ${new Date(c.updated).toLocaleDateString()}</div></div><div class="actions"><button class="btn open" data-id="${c.id}">Open</button><button class="btn danger del" data-id="${c.id}">Delete</button></div></div>`).join("")}
function chartHTML(){const c=current();return `<div class="app"><div class="top"><div><div class="brand">SimEHR</div><div class="sub">${esc(c.patient.name||"New Patient")} • ${esc(c.patient.scenario||"New Simulation")}</div></div><div class="actions"><button class="btn" id="back">← Patients</button><button class="btn" id="saveBtn">Save</button></div></div><div class="layout"><aside class="sidebar">${["summary","assessment","vitals","labs","orders","notes","final"].map(x=>`<button class="nav ${activeTab===x?"active":""}" data-nav="${x}">${({summary:"Patient Summary",assessment:"Assessment",vitals:"Vitals / Flowsheet",labs:"Labs / Flowsheet",orders:"Orders",notes:"Nursing Notes",final:"Final Dx / Debrief"})[x]}</button>`).join("")}</aside><main class="main">${patientHeader(c)}${tabHTML(c)}</main></div></div>`}
function patientHeader(c){return `<div class="patient-head"><div class="grid g3">${input("Patient name","patient.name",c.patient.name)}${input("DOB","patient.dob",c.patient.dob,'type="date"')}${input("MRN","patient.mrn",c.patient.mrn)}${input("Allergies","patient.allergies",c.patient.allergies)}<label>Code status<select class="field" data-key="patient.code"><option ${c.patient.code==="Full Code"?"selected":""}>Full Code</option><option ${c.patient.code==="DNR"?"selected":""}>DNR</option><option ${c.patient.code==="DNI"?"selected":""}>DNI</option></select></label>${input("Scenario","patient.scenario",c.patient.scenario)}</div></div>`}
function tabHTML(c){if(activeTab==="summary")return summary(c);if(activeTab==="assessment")return assessment(c);if(activeTab==="vitals")return flowsheet(c,"vitals",["Time","BP","HR","RR","SpO₂","Temp","Pain"],["time","bp","hr","rr","spo2","temp","pain"]);if(activeTab==="labs")return labs(c);if(activeTab==="orders")return orders(c);if(activeTab==="notes")return notes(c);return finalTab(c)}
function summary(c){return `<div class="card"><h2 class="section-title">Patient Summary</h2><label>Chief complaint<textarea class="field" rows="4" data-key="patient.chief">${esc(c.patient.chief)}</textarea></label><div style="height:12px"></div><label>History / relevant information<textarea class="field" rows="7" data-key="patient.history">${esc(c.patient.history||"")}</textarea></label></div><div class="card"><h2 class="section-title">Chart status</h2><span class="badge">${c.notes.length} notes</span> <span class="badge">${c.vitals.length} vital sets</span> <span class="badge">${c.labs.length} lab sets</span></div>`}
function assessment(c){return `<div class="card"><h2 class="section-title">Assessment</h2><p class="muted">Select every finding that applies. You can select multiple options in each section.</p>${Object.entries(assessmentGroups).map(([g,opts])=>`<div style="margin:18px 0"><h3>${g}</h3><div class="checkgrid">${opts.map(o=>`<label class="check"><input type="checkbox" data-assess="${esc(g)}" value="${esc(o)}" ${(c.assessment[g]||[]).includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div><label style="margin-top:8px">Other / notes<textarea class="field" rows="2" data-other="${esc(g)}">${esc((c.assessment._other||{})[g]||"")}</textarea></label></div>`).join("")}</div>`}
function flowsheet(c,type){const rows=c.vitals||[];while(rows.length<6)rows.push({time:"",bp:"",hr:"",rr:"",spo2:"",temp:"",pain:""});c.vitals=rows;const defs=[["bp","Blood pressure"],["hr","Heart rate"],["rr","Respiratory rate"],["spo2","SpO₂"],["temp","Temperature"],["pain","Pain"]];return `<div class="card"><div class="actions" style="justify-content:space-between"><div><h2 class="section-title">Vitals Flowsheet</h2><div class="muted">Measurements run vertically. Time points run across the top. Tab moves down the current time column.</div></div><button class="btn primary" id="addVitalTime">+ Time</button></div><div class="scroll"><table class="flowsheet"><thead><tr><th class="sticky-label">Vital</th>${rows.map((r,i)=>`<th><input class="field flow-time" data-row="${i}" value="${esc(r.time||"")}" placeholder="14:00"></th>`).join("")}</tr></thead><tbody>${defs.map(([key,label])=>`<tr><th class="sticky-label">${label}</th>${rows.map((r,i)=>`<td><input class="field flowcell" data-row="${i}" data-k="${key}" value="${esc(r[key]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function labs(c){const cols=c.labCols||["WBC","Hgb","Hct","Platelets","Na","K","Cl","CO₂","BUN","Cr","Glucose","Lactate"];c.labCols=cols;const selected=c.orders.labwork||[];const common=["CBC","BMP","CMP","Magnesium","Phosphorus","PT/INR","aPTT","Lactate","Troponin","BNP","Blood cultures","Urinalysis","Urine culture","ABG","VBG","Glucose","Lipase","Amylase","CRP","Procalcitonin","Pregnancy test","Type & screen"];const rows=c.labs||[];while(rows.length<6)rows.push({time:""});c.labs=rows;return `<div class="card"><h2 class="section-title">Lab Orders</h2><p class="muted">Select multiple labs at once. No individual add buttons or notes fields.</p><div class="checkgrid">${common.map(x=>`<label class="check"><input type="checkbox" class="labordercheck" value="${esc(x)}" ${selected.includes(x)?"checked":""}>${esc(x)}</label>`).join("")}</div><label style="margin-top:10px">Other lab orders<textarea class="field compact-note" id="otherLabOrders" rows="2" placeholder="Additional orders, one per line...">${esc(c.orders.otherLabOrders||"")}</textarea></label></div><div class="card"><div class="actions" style="justify-content:space-between"><div><h2 class="section-title">Lab Results Flowsheet</h2><div class="muted">Labs are vertical; result times are horizontal. Tab moves down the current time column.</div></div><div class="actions"><button class="btn" id="addLab">+ Lab</button><button class="btn primary" id="addLabTime">+ Time</button></div></div><div class="scroll"><table class="flowsheet"><thead><tr><th class="sticky-label">Lab</th>${rows.map((r,i)=>`<th><input class="field lab-time" data-row="${i}" value="${esc(r.time||"")}" placeholder="14:00"></th>`).join("")}</tr></thead><tbody>${cols.map(col=>`<tr><th class="sticky-label"><input class="field labhead" data-col="${esc(col)}" value="${esc(col)}"></th>${rows.map((r,i)=>`<td><input class="field labcell" data-row="${i}" data-k="${esc(col)}" value="${esc(r[col]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function orders(c){const groups=[["medications","Medications"],["interventions","Interventions"],["imaging","Imaging"],["consults","Consults"]];return groups.map(([key,title])=>`<div class="card"><div class="actions" style="justify-content:space-between"><h2 class="section-title">${title}</h2><button class="btn primary addOrder" data-type="${key}">+ Add</button></div>${(c.orders[key]||[]).map((o,i)=>key==="imaging"?imagingOrder(o,i):regularOrder(o,i,key)).join("")||`<p class="muted">No ${title.toLowerCase()} entered.</p>`}</div>`).join("")}
function imagingOrder(o,i){const types=["Ultrasound","CT","MRI","X-ray","Other"];const bodies={Ultrasound:["Abdomen","Pelvis","RUQ","Renal/Kidney","Bladder","OB/Pregnancy","DVT/Venous","Cardiac/Echo","Thyroid","Testicular/Scrotal","Breast","Other"],CT:["Head/Brain","Chest","Abdomen","Pelvis","Abdomen/Pelvis","Spine","Sinuses","Extremity","Other"],MRI:["Brain","Spine","Abdomen","Pelvis","Joint/Extremity","Cardiac","Other"],"X-ray":["Chest","Abdomen/KUB","Pelvis","Spine","Extremity","Skull","Other"],Other:["Other"]};return `<div class="order-block"><div class="grid g3"><label>Imaging type<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="type">${types.map(x=>`<option ${o.type===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Body / study<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="body">${(bodies[o.type||"Ultrasound"]||["Other"]).map(x=>`<option ${o.body===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Status<select class="field ordercell" data-type="imaging" data-i="${i}" data-k="status"><option ${o.status==="Ordered"?"selected":""}>Ordered</option><option ${o.status==="In Progress"?"selected":""}>In Progress</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Pending"?"selected":""}>Pending</option></select></label></div><label style="margin-top:10px">Imaging result<textarea class="field compact-note ordercell" data-type="imaging" data-i="${i}" data-k="result" rows="2" placeholder="Enter result when available...">${esc(o.result||"")}</textarea></label><label style="margin-top:10px">Media<input class="field media" data-type="imaging" data-i="${i}" type="file" accept="image/*,.pdf"></label><button class="btn danger removeOrder" data-type="imaging" data-i="${i}" style="margin-top:8px">Remove</button></div>`}
function regularOrder(o,i,key){return `<div class="order-block"><div class="grid g2"><label>Description<input class="field ordercell" data-type="${key}" data-i="${i}" data-k="description" value="${esc(o.description||"")}"></label><label>Status<select class="field ordercell" data-type="${key}" data-i="${i}" data-k="status"><option ${o.status==="Ordered"?"selected":""}>Ordered</option><option ${o.status==="In Progress"?"selected":""}>In Progress</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Pending"?"selected":""}>Pending</option></select></label></div><button class="btn danger removeOrder" data-type="${key}" data-i="${i}" style="margin-top:8px">Remove</button></div>`}

function notes(c){return `<div class="card"><h2 class="section-title">Nursing Notes</h2><label>Note type<select class="field" id="noteType"><option>Focused assessment</option><option>Reassessment</option><option>Intervention</option><option>Provider notification</option><option>SBAR handoff</option></select></label><label style="margin-top:10px">Note<textarea class="field" id="noteText" rows="8" placeholder="Document objectively..."></textarea></label><button class="btn primary" id="addNote" style="margin-top:10px">Sign & timestamp</button></div><div class="card"><h2 class="section-title">Timeline</h2>${c.notes.slice().reverse().map(n=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(n.type)}</b><div class="muted">${new Date(n.time).toLocaleString()}</div><div style="white-space:pre-wrap;margin-top:5px">${esc(n.text)}</div></div>`).join("")||`<p class="muted">No notes yet.</p>`}</div>`}
function finalTab(c){return `<div class="card"><h2 class="section-title">Final Diagnosis & Disposition</h2><div class="grid g2">${input("Primary diagnosis","final.diagnosis",c.final.diagnosis)}${input("Secondary diagnoses","final.secondary",c.final.secondary)}<label>Disposition<select class="field" data-key="final.disposition"><option value="">Select...</option>${["Discharged home","Admitted","ICU","Transferred","OR","Other"].map(x=>`<option ${c.final.disposition===x?"selected":""}>${x}</option>`).join("")}</select></label>${input("Discharge time","final.discharge",c.final.discharge,'type="datetime-local"')}</div><label style="margin-top:12px">Discharge instructions<textarea class="field compact-note" rows="3" data-key="final.instructions">${esc(c.final.instructions||"")}</textarea></label></div><div class="card"><h2 class="section-title">My Learning Notes</h2><p class="muted">Large areas for reflection and study notes.</p><label>What went well<textarea class="field learning-note" rows="7" data-key="final.wentWell">${esc(c.final.wentWell||"")}</textarea></label><label style="margin-top:12px">What could I have done better?<textarea class="field learning-note" rows="7" data-key="final.improve">${esc(c.final.improve||"")}</textarea></label><label style="margin-top:12px">Definitions / concepts to review<textarea class="field learning-note" rows="7" data-key="final.definitions">${esc(c.final.definitions||"")}</textarea></label><label style="margin-top:12px">Questions to look up later<textarea class="field learning-note" rows="7" data-key="final.questions">${esc(c.final.questions||"")}</textarea></label></div>`}

function bind(){
  const c=current();
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));
  document.getElementById("back")?.addEventListener("click",()=>{currentId=null;render()});
  document.getElementById("saveBtn")?.addEventListener("click",()=>{update();toast("Chart saved")});
  document.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",e=>{setPath(c,e.target.dataset.key,e.target.value);update()}));
  document.querySelectorAll("[data-assess]").forEach(el=>el.addEventListener("change",e=>{const g=e.target.dataset.assess;c.assessment[g]=c.assessment[g]||[];if(e.target.checked)c.assessment[g].push(e.target.value);else c.assessment[g]=c.assessment[g].filter(x=>x!==e.target.value);update()}));
  document.querySelectorAll("[data-other]").forEach(el=>el.addEventListener("input",e=>{c.assessment._other=c.assessment._other||{};c.assessment._other[e.target.dataset.other]=e.target.value;update()}));

  document.querySelectorAll(".flow-time").forEach(el=>el.addEventListener("input",e=>{c.vitals[+e.target.dataset.row].time=e.target.value;update()}));
  document.querySelectorAll(".flowcell").forEach(el=>el.addEventListener("input",e=>{c.vitals[+e.target.dataset.row][e.target.dataset.k]=e.target.value;update()}));
  document.getElementById("addVitalTime")?.addEventListener("click",()=>{c.vitals.push({time:"",bp:"",hr:"",rr:"",spo2:"",temp:"",pain:""});update();render()});

  document.querySelectorAll(".lab-time").forEach(el=>el.addEventListener("input",e=>{c.labs[+e.target.dataset.row].time=e.target.value;update()}));
  document.querySelectorAll(".labcell").forEach(el=>el.addEventListener("input",e=>{c.labs[+e.target.dataset.row][e.target.dataset.k]=e.target.value;update()}));
  document.querySelectorAll(".labhead").forEach(el=>el.addEventListener("change",e=>{const old=e.target.dataset.col,next=e.target.value.trim()||old;if(next!==old){c.labCols=c.labCols.map(x=>x===old?next:x);c.labs.forEach(r=>{if(r[old]!==undefined){r[next]=r[old];delete r[old]}});update();render()}}));
  document.getElementById("addLabTime")?.addEventListener("click",()=>{c.labs.push({time:""});update();render()});
  document.getElementById("addLab")?.addEventListener("click",()=>{const name="New Lab "+(c.labCols.length+1);c.labCols.push(name);c.labs.forEach(r=>r[name]="");update();render()});
  document.querySelectorAll(".labordercheck").forEach(el=>el.addEventListener("change",()=>{c.orders.labwork=[...document.querySelectorAll(".labordercheck:checked")].map(x=>x.value);update()}));
  document.getElementById("otherLabOrders")?.addEventListener("input",e=>{c.orders.otherLabOrders=e.target.value;update()});

  document.querySelectorAll(".addOrder").forEach(b=>b.onclick=()=>{c.orders[b.dataset.type].push(b.dataset.type==="imaging"?{type:"Ultrasound",body:"Abdomen",status:"Ordered",result:""}:{description:"",status:"Ordered"});update();render()});
  document.querySelectorAll(".removeOrder").forEach(b=>b.onclick=()=>{c.orders[b.dataset.type].splice(+b.dataset.i,1);update();render()});
  document.querySelectorAll(".ordercell").forEach(el=>el.addEventListener("change",e=>{const o=c.orders[e.target.dataset.type][+e.target.dataset.i];o[e.target.dataset.k]=e.target.value;update();if(e.target.dataset.type==="imaging"&&e.target.dataset.k==="type"){o.body=e.target.value==="Ultrasound"?"Abdomen":e.target.value==="CT"?"Head/Brain":e.target.value==="MRI"?"Brain":e.target.value==="X-ray"?"Chest":"Other";render()}}));
  document.querySelectorAll(".media").forEach(el=>el.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;c.orders[e.target.dataset.type][+e.target.dataset.i].mediaName=f.name;update();toast("Media selected for this imaging order")}));

  document.getElementById("addNote")?.addEventListener("click",()=>{const t=document.getElementById("noteText"),type=document.getElementById("noteType");if(!t.value.trim()){toast("Enter a note first");return}c.notes.push({time:new Date().toISOString(),type:type.value,text:t.value});t.value="";update();render();toast("Note signed")});
}
document.addEventListener("DOMContentLoaded",()=>{if(!currentId)render();});
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=4').catch(()=>{});}</script></body>
</html>
